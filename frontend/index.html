<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <meta name="description" content="FraudGuard - Real-time insurance claim fraud detection powered by XGBoost ML" />

    <!-- PWA theme colors -->
    <meta name="theme-color" content="#080b14" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f7ff" media="(prefers-color-scheme: light)" />

    <!-- iOS PWA support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FraudGuard" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- Standard icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png" />

    <!-- Windows tile -->
    <meta name="msapplication-TileColor" content="#080b14" />
    <meta name="msapplication-TileImage" content="/icons/icon-144x144.png" />

    <title>FraudGuard - Fraud Detection</title>

    <!-- Anti-FOUC: apply saved theme before React loads -->
    <script>
      (function () {
        var saved = localStorage.getItem("fraud-guard-theme");
        var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        var theme = saved === "light" ? "light" : saved === "dark" ? "dark" : prefersDark ? "dark" : "light";
        if (theme === "light") {
          document.documentElement.classList.add("light");
        } else {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
